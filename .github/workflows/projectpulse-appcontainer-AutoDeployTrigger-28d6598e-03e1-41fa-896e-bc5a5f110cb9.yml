name: Trigger auto deployment for projectpulse-appcontainer

# When this action will be executed
on:
  # Automatically trigger only for runtime/build-affecting changes on main.
  push:
    branches:
      - main
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - 'Dockerfile'
      - 'VERSION'
      - 'environment.example.json'
      - '.github/workflows/projectpulse-appcontainer-AutoDeployTrigger-28d6598e-03e1-41fa-896e-bc5a5f110cb9.yml'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # This is required for requesting the OIDC JWT Token
      contents: read # Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Read image version
        id: version
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.PROJECTPULSEAPPCONTAINER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.PROJECTPULSEAPPCONTAINER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.PROJECTPULSEAPPCONTAINER_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: projectpulsectrregistry-hgc2freaekb8h8ag.azurecr.io
          registryUsername: ${{ secrets.PROJECTPULSEAPPCONTAINER_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.PROJECTPULSEAPPCONTAINER_REGISTRY_PASSWORD }}
          containerAppName: projectpulse-appcontainer
          resourceGroup: NewWorld-RSG
          imageToBuild: projectpulsectrregistry-hgc2freaekb8h8ag.azurecr.io/projectpulse-appcontainer:${{ steps.version.outputs.version }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_
