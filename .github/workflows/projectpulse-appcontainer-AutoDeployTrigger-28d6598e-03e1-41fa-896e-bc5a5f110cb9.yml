name: Trigger auto deployment for projectpulse-appcontainer

# When this action will be executed
on:
  # Automatically trigger only for runtime/build-affecting changes on main.
  push:
    branches:
      - main
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - 'Dockerfile'
      - 'VERSION'
      - 'environment.example.json'
      - '.github/workflows/projectpulse-appcontainer-AutoDeployTrigger-28d6598e-03e1-41fa-896e-bc5a5f110cb9.yml'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # This is required for requesting the OIDC JWT Token
      contents: read # Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v7

      - name: Read image version
        id: version
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.PROJECTPULSEAPPCONTAINER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.PROJECTPULSEAPPCONTAINER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.PROJECTPULSEAPPCONTAINER_AZURE_SUBSCRIPTION_ID }}

      - name: Build, push, and deploy RTA Container App
        shell: bash
        env:
          REGISTRY_URL: projectpulsectrregistry-hgc2freaekb8h8ag.azurecr.io
          REGISTRY_USERNAME: ${{ secrets.PROJECTPULSEAPPCONTAINER_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.PROJECTPULSEAPPCONTAINER_REGISTRY_PASSWORD }}
          IMAGE_NAME: projectpulsectrregistry-hgc2freaekb8h8ag.azurecr.io/projectpulse-appcontainer:${{ steps.version.outputs.version }}
        run: |
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" --username "$REGISTRY_USERNAME" --password-stdin
          docker build --tag "$IMAGE_NAME" .
          docker push "$IMAGE_NAME"
          az containerapp update \
            --name projectpulse-appcontainer \
            --resource-group NewWorld-RSG \
            --image "$IMAGE_NAME"

      # Reuse the image built above so both runtime roles run the same version.
      - name: Deploy image to Service Bus Container App
        shell: bash
        run: |
          az containerapp update \
            --name projectpulse-sb-appcontainer \
            --resource-group NewWorld-RSG \
            --image "projectpulsectrregistry-hgc2freaekb8h8ag.azurecr.io/projectpulse-appcontainer:${{ steps.version.outputs.version }}"
